services:
  - type: web
    name: bookleaf-portal
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTHOR_PASSWORD
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
